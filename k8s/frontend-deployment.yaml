apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlops-frontend
  labels:
    app: mlops-frontend
    tier: ui
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mlops-frontend
  template:
    metadata:
      labels:
        app: mlops-frontend
        tier: ui
    spec:
      containers:
        - name: frontend
          image: cloud-mlops-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
