global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: "mlops-fastapi-backend"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["backend:8000"]
    # Fallback host target for local docker on desktop
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
